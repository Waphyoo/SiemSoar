services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-main
    environment:
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=your-secret-token
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/tmp
      - WEBHOOK_URL=https://actually-all-easier-lovers.trycloudflare.com/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - shared_tmp:/tmp

  task-runners:
    build: .
    container_name: n8n-runners
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
      - N8N_RUNNERS_AUTH_TOKEN=your-secret-token
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json
    depends_on:
      - n8n

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://n8n-main:5678
    restart: always

  file-processor:
      image: bash:5.2
      container_name: n8n-file-processor
      volumes:
        - shared_tmp:/tmp
      restart: unless-stopped
      command: >
        bash -c '
          log() { echo "$(date +"%F %T") [processor] $$*"; }
          log "Watching /tmp for input_*.json ..."
          while true; do
            for f in /tmp/input_*.json; do
              [[ -f "$$f" ]] || continue
              out="/tmp/output_$${f##*/input_}"
              payload=$(grep -o "\"payload\":\"[^\"]*\"" "$$f" | cut -d\" -f4)
              printf "{\"status\":\"success\",\"output\":\"%s_DONE\"}\n" "$$payload" > "$$out"
              log "Done: $$(basename $$out)"
              rm -f "$$f"
            done
            sleep 1
          done
        '
      depends_on:
        - n8n

volumes:
  n8n_data:
  shared_tmp: